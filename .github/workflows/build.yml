name: PingPongの自動ビルドとリリース

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows向け自動コンパイル・リリース工程
    runs-on: windows-latest

    steps:

    - name: 📦 mainブランチ（通常版・共通アセット）を取得
      uses: actions/checkout@v4
      with:
        ref: main
        path: main-branch

    - name: 📦 masterブランチ（協力ハード版）を取得
      uses: actions/checkout@v4
      with:
        ref: master
        path: master-branch

    - name: 🛠 raylibインストール
      run: |
        vcpkg install raylib:x64-windows

    # =========================
    # 通常版
    # =========================
    - name: 💻 1. 通常版ビルド
      run: |
        $env:PATH += ";C:/vcpkg/installed/x64-windows/bin"

        cd main-branch

        if (Test-Path Makefile) {
          mingw32-make
        } else {
          gcc pingpong_main.c action.c `
          -IC:/vcpkg/installed/x64-windows/include `
          -LC:/vcpkg/installed/x64-windows/lib `
          -lraylib -lopengl32 -lgdi32 -lwinmm `
          -o pingpong.exe
        }

        Compress-Archive `
          -Path pingpong.exe,bgm.mp3,gameover.mp3 `
          -DestinationPath "../pingpong.zip"

        cd ..


    # =========================
    # 協力版
    # =========================
    - name: 💻 2. 協力モードビルド
      run: |
        $env:PATH += ";C:/vcpkg/installed/x64-windows/bin"

        cd main-branch/kyouryoku2

        if (Test-Path Makefile) {
          mingw32-make
        } else {
          gcc pingpong_main.c action.c `
          -IC:/vcpkg/installed/x64-windows/include `
          -LC:/vcpkg/installed/x64-windows/lib `
          -lraylib -lopengl32 -lgdi32 -lwinmm `
          -o pingpong.exe
        }

        Compress-Archive `
          -Path pingpong.exe,bgm.mp3,gameover.mp3 `
          -DestinationPath "../../pingpong-kyouryoku2.zip"

        cd ../..


    # =========================
    # ハード協力版
    # =========================
    - name: 💻 3. 協力ハードモードビルド
      run: |
        $env:PATH += ";C:/vcpkg/installed/x64-windows/bin"

        cd master-branch

        if (Test-Path Makefile) {
          mingw32-make
        } else {
          gcc pingpong_main.c action.c `
          -IC:/vcpkg/installed/x64-windows/include `
          -LC:/vcpkg/installed/x64-windows/lib `
          -lraylib -lopengl32 -lgdi32 -lwinmm `
          -o pingpong.exe
        }

        Compress-Archive `
          -Path pingpong.exe,bgm.mp3,gameover.mp3 `
          -DestinationPath "../pingpong-kyouryoku2-hard.zip"

        cd ..


    # =========================
    # Inno Setup
    # =========================
    - name: 🗜 Inno Setupによるインストーラー作成
      run: |

        if (Test-Path main-branch/License) {
          Copy-Item main-branch/License License
        }
        else {
          New-Item -ItemType File -Force -Path License
        }


        if (Test-Path main-branch/setup.iss) {
          iscc main-branch/setup.iss
        }
        else {
          Write-Error "setup.iss がありません"
          exit 1
        }


    # =========================
    # Release
    # =========================
    - name: 🚀 GitHub Release公開
      uses: softprops/action-gh-release@v2
      with:
        files: |
          main-branch/Output/PingPong_Setup.exe
        tag_name: latest
        release_name: PingPong 最新版インストーラー
        draft: false
        prerelease: false
        make_latest: true

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


    # =========================
    # Pages
    # =========================
    - name: 🌐 GitHub Pagesへデプロイ
      uses: peaceiris/actions-gh-pages@v4

      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./main-branch/web
        publish_branch: gh-pages
