name: PingPongの自動ビルドとリリース

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows向けビルド工程
    runs-on: windows-latest

    steps:
    - name: 📦 ソースコードを取得
      uses: actions/checkout@v4

    - name: 🛠 raylib（ライブラリ）の自動インストール
      run: |
        vcpkg install raylib:x64-windows

    - name: 💻 ゲームのコンパイル（環境変数でパスを強制上書き）
      run: |
        # GitHub上の正しいraylibの場所を取得
        $VCPKG_INCLUDE = "C:/vcpkg/installed/x64-windows/include"
        $VCPKG_LIB = "C:/vcpkg/installed/x64-windows/lib"

        # Windowsの環境変数（C_INCLUDE_PATHとLIBRARY_PATH）をセット
        # これをすると、Makefileの記述よりも優先してこのパスを見に行ってくれます！
        $env:C_INCLUDE_PATH = "$VCPKG_INCLUDE"
        $env:LIBRARY_PATH = "$VCPKG_LIB"

        if (Test-Path Makefile) {
          # Makefileを実行（環境変数が効いているのでraylib.hが見つかります）
          mingw32-make
        } else {
          # Makefileがない場合の直接コンパイル
          gcc pingpong_main.c action.c -I$VCPKG_INCLUDE -L$VCPKG_LIB -lraylib -lopengl32 -lgdi32 -lwinmm -o PingPong.exe
        }

    - name: 🗜 配布用セットアップ（またはZip）の作成
      run: |
        if (Test-Path setup.iss) {
          iscc setup.iss
        } else {
          # 成果物（Exeや音楽ファイル）を自動でZipにまとめます
          Compress-Archive -Path PingPong.exe, bgm.mp3, gameover.mp3 -DestinationPath PingPong_Game.zip
        }

    - name: 🚀 GitHubへの自動リリース（下書き作成）
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          *.exe
          *.zip
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
