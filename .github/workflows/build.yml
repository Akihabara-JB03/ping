name: PingPongの自動ビルドとリリース

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows向けビルド工程
    runs-on: windows-latest

    steps:
    - name: 📦 ソースコードを取得
      uses: actions/checkout@v4

    - name: 🗜 配布用セットアップの作成
      run: |
        # setup.issに「License」が必要なので、もし名前が「LICENSE」などの大文字だった場合でも
        # エラーにならないように自動コピーしておきます
        if (Test-Path License) {
          # そのままでOK
        } elseif (Test-Path LICENSE) {
          Copy-Item -Path LICENSE -Destination License
        } else {
          New-Item -ItemType File -Force -Path License
        }

        # インストーラー（Inno Setup 6）を実行！
        if (Test-Path setup.iss) {
          iscc setup.iss
        } else {
          Write-Error "setup.iss が見つかりません！"
          exit 1
        }

    - name: 🚀 GitHubへの自動リリース（下書き作成）
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Output/PingPong_Setup.exe
        # タグが指定されていないプッシュの場合は、自動で「latest」という仮のリリース場所にファイルをアップロードします
        tag_name: "latest"
        release_name: "PingPong 最新ビルド (自動生成)"
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
