name: PingPongの自動ビルドとリリース

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows向けビルド工程
    runs-on: windows-latest

    steps:
    - name: 📦 ソースコードを取得
      uses: actions/checkout@v4

    - name: 🗜 配布用セットアップの作成
      run: |
        if (Test-Path License) {
          # そのままでOK
        } elseif (Test-Path LICENSE) {
          Copy-Item -Path LICENSE -Destination License
        } else {
          New-Item -ItemType File -Force -Path License
        }

        # インストーラー（Inno Setup 6）を実行！
        if (Test-Path setup.iss) {
          iscc setup.iss
        } else {
          Write-Error "setup.iss が見つかりません！"
          exit 1
        }

    - name: 🚀 GitHubへ自動リリース（本番公開）
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Output/PingPong_Setup.exe
        tag_name: "latest"
        release_name: "PingPong 最新版インストーラー"
        # 【変更】draftをfalseにすることで、下書きではなく最初から本番リリースとして公開します！
        draft: false
        prerelease: false
        # 【追加】同じ「latest」タグに毎回ファイルを上書き（更新）する設定です
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
