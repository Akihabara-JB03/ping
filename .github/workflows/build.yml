name: PingPongの自動ビルドとリリース

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows向けビルド工程
    runs-on: windows-latest

    steps:
    - name: 📦 ソースコードを取得
      uses: actions/checkout@v4

    - name: 🛠 raylib（ライブラリ）の自動インストール
      run: |
        vcpkg install raylib:x64-windows

    - name: 💻 ゲームのコンパイル（Makefileのパスを上書き）
      run: |
        # vcpkgがインストールしたraylibの場所（パス）を自動取得
        $VCPKG_INCLUDE = "C:/vcpkg/installed/x64-windows/include"
        $VCPKG_LIB = "C:/vcpkg/installed/x64-windows/lib"

        if (Test-Path Makefile) {
          # Makefileの中のパス指定を無視して、GitHub上の正しいパスを無理やり上書きしてmakeを実行します
          mingw32-make CFLAGS="-I$VCPKG_INCLUDE" LDFLAGS="-L$VCPKG_LIB"
        } else {
          # Makefileがない場合の直接コンパイル
          gcc pingpong_main.c action.c -I$VCPKG_INCLUDE -L$VCPKG_LIB -lraylib -lopengl32 -lgdi32 -lwinmm -o PingPong.exe
        }

    - name: 🗜 配布用セットアップ（またはZip）の作成
      run: |
        if (Test-Path setup.iss) {
          iscc setup.iss
        } else {
          # 成果物（Exeや音楽ファイル）を自動でZipにまとめます
          # もし他にも必要なファイル（.hなどではなくゲーム実行に必要なもの）があればここに追加してください
          Compress-Archive -Path PingPong.exe, bgm.mp3, gameover.mp3 -DestinationPath PingPong_Game.zip
        }

    - name: 🚀 GitHubへの自動リリース（下書き作成）
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          *.exe
          *.zip
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
