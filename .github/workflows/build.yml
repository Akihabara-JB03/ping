name: PingPongの自動ビルドとリリース

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows向けビルド工程
    runs-on: windows-latest

    steps:
    - name: 📦 ソースコードを取得
      uses: actions/checkout@v4

    - name: 🗜 配布用セットアップの作成
      run: |
        # Inno Setupが探しているあなたのパソコンのフォルダ（C:\Users\Owner\...）をGitHub上に再現！
        $TARGET_DIR = "C:\Users\Owner\Desktop\c_edu\c\pingpong"
        New-Item -ItemType Directory -Force -Path "$TARGET_DIR\pingpong-"
        
        # 1. mainブランチに入っているライセンスファイルを指定の場所に配置
        if (Test-Path License) {
          Copy-Item -Path License -Destination "$TARGET_DIR\pingpong-\License"
        } else {
          New-Item -ItemType File -Force -Path "$TARGET_DIR\pingpong-\License"
        }

        # 2. mainブランチに最初から入っている「3つの本物のZipファイル」をすべて指定の場所にコピー！
        $ZIPS = @("pingpong.zip", "pingpong-kyouryoku2.zip", "pingpong-kyouryoku2-hard.zip")
        
        foreach ($zip in $ZIPS) {
          if (Test-Path $zip) {
            Copy-Item -Path $zip -Destination "$TARGET_DIR\$zip"
            Write-Output "$zip を指定フォルダに配置しました。"
          } else {
            Write-Error "mainブランチに $zip が見つかりません！リポジトリの直下に置いてあるか確認してください。"
            exit 1
          }
        }

        # 3. インストーラー（Inno Setup 6）を実行して、3つのZipを閉じ込めたSetup.exeを作ります！
        if (Test-Path setup.iss) {
          iscc setup.iss
        } else {
          Write-Error "setup.iss が見つかりません！"
          exit 1
        }

    - name: 🚀 GitHubへの自動リリース（下書き作成）
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          Output/PingPong_Setup.exe
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
